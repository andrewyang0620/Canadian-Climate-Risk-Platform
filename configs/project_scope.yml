project:
  name: canadian_climate_property_risk_platform
  display_name: Canadian Climate & Property Risk Data Platform
  environment: local-dev
  description: 'DE-focused Azure/Spark geospatial lakehouse for BC and Alberta climate, hydrometric, wildfire,
    disaster, development, and municipal property-context exposure screening.

    '
geographic_scope:
  provinces:
  - code: BC
    name: British Columbia
  - code: AB
    name: Alberta
  cities:
  - name: Vancouver
    province: BC
    role: parcel_exposure_deep_dive
  - name: Calgary
    province: AB
    role: property_flood_exposure_deep_dive
time_scope:
  historical_baseline:
    start_year: 2016
    end_year: 2025
    purpose: historical_baseline_percentiles_anomalies_backtesting
  incremental_refresh:
    start_year: 2026
    purpose: current_monitoring_layer
  vancouver_permits:
    start_year: 2017
    end_year: null
  municipal_property:
    start_year: null
    end_year: null
    selection_policy: latest_available_snapshot
    note: 'Municipal property datasets are treated as current or latest available snapshots unless historical
      years are explicitly exposed by the source.

      '
spatial_units:
  province_grid:
    name: grid_10km_bc_ab
    resolution_m: 10000
    area: BC_AB
    core: true
  city_grid:
    name: grid_1km_vancouver_calgary
    resolution_m: 1000
    area:
    - Vancouver
    - Calgary
    core: true
  vancouver_parcel:
    name: vancouver_property_parcel
    geometry_type: polygon
    core: true
  calgary_property:
    name: calgary_property_or_parcel
    geometry_type: polygon_or_centroid
    core: true
  municipality:
    name: census_subdivision_municipality
    geometry_type: polygon
    core: true
non_goals:
- insurance_underwriting_model
- legal_property_risk_assessment
- engineering_grade_flood_depth_model
- property_value_prediction_model
- full_stack_webgis_application
- real_time_streaming_platform
- full_canada_property_level_model
- treating_missing_hazard_features_as_low_risk
- using_point_nearest_grid_mapping_when_valid_polygon_or_basin_sources_are_available
spatial_modeling_policy:
  principle: prefer_area_based_sources_for_grid_level_features
  description: For grid-level climate and hazard features, polygon, basin, perimeter, hazard-zone, parcel,
    and administrative boundary datasets should be preferred over point-only datasets when an area-based
    source is available.
  point_source_policy: Point-only sources may be used when no area-based source exists, but the Gold feature
    logic must preserve whether each value is directly observed, interpolated, spatially allocated, or
    missing.
  no_data_policy: No-data must not be interpreted as low-risk.
  implementation_note: This policy is architectural only. New source registration, IDW parameters, polygon-grid
    thresholds, and scoring inputs must be added in later branches after source profiling and validation.
