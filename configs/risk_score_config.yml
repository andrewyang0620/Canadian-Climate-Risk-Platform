domain_weights:
  climate: 0.35
  hydro: 0.35
  wildfire: 0.30

climate:
  normalization: province_calendar_month_zero_preserving_positive_percentile

  signals:
    extreme_heat_days:
      field: climate_extreme_heat_days
      weight: 0.30

    heavy_precipitation_days:
      field: climate_heavy_precipitation_days
      weight: 0.25

    freeze_thaw_days:
      field: climate_freeze_thaw_days
      weight: 0.15

    extreme_cold_days:
      field: climate_extreme_cold_days
      weight: 0.15

    total_precip_mm:
      field: climate_total_precip_mm
      weight: 0.15

  quality:
    mapping_method_field: climate_mapping_method
    idw_confidence_field: climate_idw_confidence_score
    completeness_field: climate_data_completeness_score

    direct_mapping_methods:
      - direct_station_in_cell
      - direct_station_average_in_cell

    no_coverage_method: no_station_within_radius

hydro:
  minimum_history_years: 5

  signals:
    flow_p95:
      field: flow_p95_measurement_value
      weight: 0.30
      normalization: grid_calendar_month_historical_percentile

    flow_variability:
      max_field: flow_max_measurement_value
      min_field: flow_min_measurement_value
      weight: 0.15
      normalization: grid_calendar_month_historical_percentile

    flow_zero_observation_ratio:
      numerator_field: flow_zero_day_count
      denominator_field: flow_observation_day_count
      weight: 0.15
      normalization: none

    level_p95:
      field: level_p95_measurement_value
      weight: 0.25
      normalization: grid_calendar_month_historical_percentile

    level_variability:
      max_field: level_max_measurement_value
      min_field: level_min_measurement_value
      weight: 0.15
      normalization: grid_calendar_month_historical_percentile

  availability:
    domain_flag: has_hydro_feature
    flow_flag: has_hydro_flow_feature
    level_flag: has_hydro_level_feature

  quality:
    assignment_method_field: hydro_spatial_assignment_method
    basin_coverage_field: hydro_basin_grid_coverage_ratio
    completeness_field: hydro_data_completeness_score
    basin_method: basin_polygon_intersection
    point_method: station_point_in_cell
    point_quality_factor: 0.70

wildfire:
  field: wildfire_intersection_area_ratio_of_grid
  normalization: province_zero_preserving_positive_percentile
  quality: 1.0

missing_data:
  renormalize_available_signal_weights: true
  renormalize_available_domain_weights: true
  fill_missing_with_zero: false

composite:
  minimum_available_domains: 2

confidence:
  renormalize_missing_domains: false

ranking:
  group_by:
    - province_key
    - reference_month

  minimum_boundary_coverage_ratio: 0.01

priority_tiers:
  very_high: 0.90
  high: 0.75
  elevated: 0.50
  moderate: 0.25

backtesting:
  label_start: 2016-01
  label_end: 2022-09
  top_k_fraction: 0.10

  metrics:
    - event_capture_at_10
    - capture_lift_at_10
    - precision_at_10
    - precision_lift_at_10
    - pr_auc
    - spearman_rank_correlation
    - jaccard_top_10

sensitivity:
  baseline:
    climate: 0.35
    hydro: 0.35
    wildfire: 0.30

  equal:
    climate: 0.333333
    hydro: 0.333333
    wildfire: 0.333334

  climate_heavy:
    climate: 0.45
    hydro: 0.30
    wildfire: 0.25

  hydro_heavy:
    climate: 0.30
    hydro: 0.45
    wildfire: 0.25

  wildfire_heavy:
    climate: 0.30
    hydro: 0.30
    wildfire: 0.40