sources:
  eccc_historical_climate:
    display_name: ECCC Historical Climate Daily Observations - BC and Alberta
    source_group: national
    provider: Environment and Climate Change Canada
    source_url: https://api.weather.gc.ca/collections/climate-daily
    access_method: geomet_ogc_api_pagination
    expected_frequency: periodic
    file_format: jsonl_gzip
    spatial_grain: climate_station
    temporal_grain: daily
    time_window:
      start_year: 2016
      end_year: 2025
    target_bronze_table: bronze_climate_daily
    target_silver_table: silver_climate_daily
    downstream_use:
    - weather_extreme_score
    - precip_percentile
    - heat_anomaly_score
    - grid_month_hazard_exposure
    required_fields:
    - geometry
    - properties
    climate_measurement_contract:
      required_for_downstream_features: true
      candidate_raw_fields:
        station_id:
        - STATION_ID
        - station_id
        - CLIMATE_IDENTIFIER
        - climate_identifier
        - LOCAL_ID
        - local_id
        observation_date:
        - LOCAL_DATE
        - local_date
        - DATE
        - date
        temperature:
        - MAX_TEMPERATURE
        - MIN_TEMPERATURE
        - MEAN_TEMPERATURE
        - MAX_TEMP
        - MIN_TEMP
        - MEAN_TEMP
        - max_temperature
        - min_temperature
        - mean_temperature
        precipitation:
        - TOTAL_PRECIPITATION
        - TOTAL_RAIN
        - TOTAL_SNOW
        - TOTAL_PRECIP
        - total_precipitation
        - total_rain
        - total_snow
      validation_rule: station_date_and_at_least_one_measurement_required_after_silver_standardization
      downstream_standard_names:
        max_temperature: max_temp_c
        min_temperature: min_temp_c
        mean_temperature: mean_temp_c
        total_precipitation: total_precip_mm
      note: Bronze stores GeoJSON features as JSONL.GZ. Exact raw property names are confirmed through
        profiling; Silver standardization maps available ECCC fields into stable climate measurement columns.
      required_measurements:
      - temperature
      - precipitation
    validation_checks:
    - schema_hash
    - row_count
    - coordinate_range
    - date_range
    post_silver_validation_checks:
    - station_id_presence
    - climate_date_validity
    - climate_measurement_presence
    - temperature_reasonable_range
    - precipitation_non_negative
    - station_geometry_presence
    - bc_ab_spatial_filter_coverage
    redistribution: public
    climate_daily_api:
      collection: climate-daily
      items_url: https://api.weather.gc.ca/collections/climate-daily/items
      format: geojson
      datetime_start: '2016-01-01'
      datetime_end: '2025-12-31'
      bbox_name: bc_ab_combined
      bbox:
      - -139.2
      - 48.0
      - -110.0
      - 60.1
      target_provinces:
      - BC
      - AB
      page_limit: 5000
      partition_by: year
      note: Bronze downloads all ECCC climate-daily GeoJSON items in the BC/Alberta bounding box for 2016-2025
        using OGC API pagination. If province fields are available in item properties, records are filtered
        to BC/AB; otherwise the bounding box is used as the spatial scope.
    coordinate_contract:
      required_for_spatial_overlay: true
      candidate_latitude_fields: []
      candidate_longitude_fields: []
      candidate_geometry_fields:
      - geometry
      validation_rule: geojson_point_geometry_required
  eccc_hydrometric_realtime:
    display_name: ECCC Hydrometric Real-Time Data
    source_group: national
    provider: Water Survey of Canada
    source_url: https://wateroffice.ec.gc.ca/
    access_method: rest_api
    expected_frequency: daily
    file_format: json_or_csv
    spatial_grain: station
    temporal_grain: daily_or_subdaily
    time_window:
      start_year: 2026
      end_year: null
    target_bronze_table: bronze_hydrometric_realtime
    target_silver_table: silver_hydro_realtime_observation
    downstream_use:
    - flood_hydrometric_signal
    - daily_hazard_pipeline
    required_fields:
    - station_id
    - observed_at
    - latitude
    - longitude
    measurement_contract:
      required_measurements:
      - discharge
      - water_level
      validation_rule: at_least_one_measurement_present_after_silver_standardization
      downstream_standard_names:
        discharge: discharge_cms
        water_level: water_level_m
      note: 'Real-time hydrometric data must produce at least one standardized water measurement after
        Silver processing. Raw API field names may differ, so this requirement is enforced after source-specific
        standardization.

        '
    validation_checks:
    - schema_hash
    - row_count
    - coordinate_range
    - freshness
    post_silver_validation_checks:
    - hydrometric_measurement_presence
    - non_negative_discharge
    - station_timestamp_uniqueness
    redistribution: public
    hydrometric_realtime_api:
      collection: hydrometric-realtime
      items_url: https://api.weather.gc.ca/collections/hydrometric-realtime/items
      bbox_name: bc_ab
      bbox:
      - -139.2
      - 48.0
      - -110.0
      - 60.1
      page_limit: 10000
      lookback_hours: 36
      target_provinces:
      - BC
      - AB
      note: Bronze downloads recent ECCC hydrometric realtime GeoJSON items in the BC/Alberta bounding
        box using GeoMet OGC API pagination.
  hydat_archive:
    display_name: HYDAT Historical Hydrometric Archive
    source_group: national
    provider: Water Survey of Canada
    source_url: https://www.canada.ca/en/environment-climate-change/services/water-overview/quantity/monitoring/survey/data-products-services/national-archive-hydat.html
    access_method: direct_zip_download
    expected_frequency: quarterly
    file_format: zip_sqlite
    spatial_grain: hydrometric_station
    temporal_grain: daily_monthly_historical
    time_window:
      start_year: 2016
      end_year: 2025
    target_bronze_table: bronze_hydat
    target_silver_table: silver_hydro_daily
    target_silver_tables:
    - silver_hydro_daily
    - silver_hydro_station
    downstream_use:
    - hydrometric_baseline
    - water_level_percentile
    - discharge_percentile
    - grid_month_hazard_exposure
    required_fields:
    - sqlite_database
    measurement_contract:
      required_measurements:
      - discharge
      - water_level
      validation_rule: at_least_one_measurement_present_after_silver_standardization
      downstream_standard_names:
        discharge: discharge_cms
        water_level: water_level_m
      candidate_tables:
      - STATIONS
      - DLY_FLOWS
      - DLY_LEVELS
      note: HYDAT Bronze stores the raw SQLite archive. Internal profiling confirms STATIONS, DLY_FLOWS,
        and DLY_LEVELS. DLY_FLOWS and DLY_LEVELS store daily values in monthly rows using FLOW1..FLOW31
        and LEVEL1..LEVEL31 columns; Silver processing will unpivot these into daily hydrometric observations.
      optional_tables:
      - ANNUAL_STATISTICS
      - ANNUAL_INSTANT_PEAKS
      - STN_DATA_RANGE
    validation_checks:
    - schema_hash
    - row_count
    - date_range
    post_silver_validation_checks:
    - hydrometric_measurement_presence
    - non_negative_discharge
    - station_date_uniqueness
    - hydat_station_bc_ab_filter_coverage
    redistribution: public
    hydat_download:
      dataset_name: Hydat_sqlite3
      release_date: '2026-04-17'
      url: http://collaboration.cmc.ec.gc.ca/cmc/hydrometrics/www/Hydat_sqlite3_20260417.zip
      filename: Hydat_sqlite3_20260417.zip
      format: zip_sqlite
      note: HYDAT SQLite archive containing historical Water Survey of Canada daily/monthly flow and water-level
        observations. Used for hydrometric baseline and flood signal features.
  wildfire_history:
    display_name: Canadian National Fire Database Fire Point Data
    source_group: national
    provider: Natural Resources Canada / Canadian Forest Service
    source_url: https://cwfis.cfs.nrcan.gc.ca/downloads/nfdb/fire_pnt/current_version/
    access_method: direct_zip_download
    expected_frequency: periodic
    file_format: zip_shapefile
    spatial_grain: wildfire_point
    temporal_grain: event
    time_window:
      start_year: 2016
      end_year: 2025
    target_bronze_table: bronze_wildfire
    target_silver_table: silver_wildfire_event
    downstream_use:
    - wildfire_exposure_score
    - wildfire_proximity_features
    - grid_month_hazard_exposure
    required_fields:
    - geometry
    validation_checks:
    - schema_hash
    - row_count
    - geometry_validity
    - event_date_range
    post_silver_validation_checks:
    - wildfire_geometry_presence
    - wildfire_event_year_presence
    - wildfire_event_geometry_validity
    - wildfire_event_bc_ab_filter_coverage
    - crs_check
    redistribution: public
    wildfire_download:
      dataset_name: NFDB_point
      url: https://cwfis.cfs.nrcan.gc.ca/downloads/nfdb/fire_pnt/current_version/NFDB_point.zip
      filename: NFDB_point.zip
      format: zip_shapefile
      source_version: current_version
      note: Canadian National Fire Database fire point shapefile. Used for wildfire event proximity/count
        features. Polygon fire perimeter data is larger and can be added later as a burned-area extension.
    wildfire_event_contract:
      required_for_downstream_features: true
      candidate_event_id_fields:
      - NFDBFIREID
      - FIRE_ID
      - fire_id
      candidate_year_fields:
      - YEAR
      - REP_YEAR
      - year
      candidate_date_fields:
      - REP_DATE
      - START_DATE
      - DATE
      - fire_date
      candidate_size_fields:
      - SIZE_HA
      - AREA_HA
      - area_ha
      validation_rule: geometry_required_at_bronze_event_fields_validated_after_silver_extraction
      note: Bronze profiling verifies the shapefile package contains geometry. DBF attribute fields are
        validated during Silver extraction when the shapefile is read into a geospatial dataframe.
  statcan_building_permits:
    display_name: Statistics Canada Building Permits
    source_group: national
    provider: Statistics Canada
    source_url: https://www150.statcan.gc.ca/
    access_method: bulk_csv
    expected_frequency: monthly
    file_format: csv
    spatial_grain: municipality
    temporal_grain: monthly
    time_window:
      start_year: 2016
      end_year: null
    target_bronze_table: bronze_statcan_building_permits
    target_silver_table: silver_permit_monthly
    downstream_use:
    - development_exposure_score
    - municipality_month_priority
    required_fields:
    - municipality
    - period
    - permit_value
    municipality_mapping_contract:
      intended_join_target: census_boundaries
      intended_join_target_silver_table: silver_boundary_municipality
      join_required_for_downstream: true
      candidate_geography_fields:
      - municipality
      - geo
      - geo_code
      - csd_name
      - csd_uid
      - province
      validation_rule: at_least_one_municipality_identifier_present_after_silver_standardization
      downstream_standard_names:
        municipality_key: municipality_key
        municipality_name: municipality_name
        province: province
      note: 'Statistics Canada building permit geography must be standardized to the municipality/CSD
        boundary table before municipality-month priority marts can be built.

        '
    validation_checks:
    - schema_hash
    - row_count
    - non_negative_values
    - date_range
    post_silver_validation_checks:
    - municipality_identifier_presence
    - municipality_boundary_join_coverage
    - permit_value_non_negative
    - municipality_month_uniqueness
    redistribution: public
  census_boundaries:
    display_name: Statistics Canada 2021 Census Province and CSD Boundaries
    source_group: national
    provider: Statistics Canada
    source_url: https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/index2021-eng.cfm?year=21
    access_method: direct_boundary_file_download
    expected_frequency: periodic
    file_format: zip_shapefile_package
    spatial_grain: province_and_census_subdivision_polygon
    temporal_grain: static_or_periodic
    time_window:
      start_year: null
      end_year: null
    target_bronze_table: bronze_boundaries
    target_silver_table: silver_boundary_municipality
    target_silver_tables:
    - silver_boundary_province
    - silver_boundary_municipality
    additional_silver_tables:
    - silver_boundary_province
    downstream_use:
    - province_filtering
    - province_grid_clipping
    - municipality_rollup
    - grid_to_municipality_map
    - validation_mapping
    required_fields:
    - geometry
    boundary_contract:
      required_boundary_outputs:
      - silver_boundary_province
      - silver_boundary_municipality
      required_standard_fields:
        silver_boundary_province:
        - province_key
        - province_name
        - geometry
        silver_boundary_municipality:
        - municipality_key
        - municipality_name
        - province
        - geometry
      validation_rule: both_province_and_municipality_boundaries_required_after_silver_standardization
      note: Bronze stores the raw 2021 Statistics Canada province and census subdivision boundary zip
        files as a combined raw package. Silver standardization must extract both province and CSD/municipality
        boundary outputs.
    validation_checks:
    - schema_hash
    - row_count
    - geometry_validity
    - crs_check
    post_silver_validation_checks:
    - province_boundary_standard_fields
    - municipality_boundary_standard_fields
    - boundary_geometry_validity
    - boundary_crs_check
    redistribution: public
    boundary_downloads:
      province_cartographic_2021:
        url: https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lpr_000b21a_e.zip
        filename: lpr_000b21a_e.zip
        boundary_level: province
        boundary_type: cartographic
        census_year: 2021
      csd_cartographic_2021:
        url: https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lcsd000b21a_e.zip
        filename: lcsd000b21a_e.zip
        boundary_level: census_subdivision
        boundary_type: cartographic
        census_year: 2021
  canadian_disaster_database:
    display_name: Canadian Disaster Database
    source_group: national
    provider: Public Safety Canada
    source_url: https://www.publicsafety.gc.ca/cnt/rsrcs/cndn-dsstr-dtbs/index-en.aspx
    open_data_dataset_id: 1c3d15f9-9cfa-4010-8462-0d67e493d9b9
    open_data_api_url: https://open.canada.ca/data/api/action/package_show
    preferred_resource_formats:
    - CSV
    - XLSX
    - XLS
    access_method: spreadsheet_download
    expected_frequency: periodic
    file_format: xlsx_or_csv
    spatial_grain: municipality_or_region
    temporal_grain: event
    time_window:
      start_year: 2016
      end_year: 2025
    target_bronze_table: bronze_disaster_events
    target_silver_table: silver_disaster_event_month
    downstream_use:
    - score_validation
    - event_capture_at_top_k
    - lift_at_top_k
    required_fields:
    - EVENT_ID
    - EVENT_START_DATE
    - PLACE
    - PROVINCES_AFFECTED / PROVINCES AFFECTÉES
    location_mapping_contract:
      required_for_downstream_validation: true
      minimum_geographic_grain: province_plus_location_text_or_geometry
      candidate_location_fields:
      - PLACE
      - GEOG_OBJ
      - PROVINCES_AFFECTED / PROVINCES AFFECTÉES
      - municipality
      - event_location
      - location
      - place
      - affected_area
      - geographic_area
      fallback_mapping_methods:
      - geog_obj_point_to_grid
      - province_level_event_month
      - manual_location_lookup_table
      - text_to_municipality_standardization
      validation_rule: event_start_date_and_place_or_geometry_required
      note: CDD raw fields use uppercase source names. EVENT_START_DATE is the event date source, PLACE
        is the free-text location field, GEOG_OBJ may provide point geometry, and PROVINCES_AFFECTED provides
        province-level geography.
    validation_checks:
    - schema_hash
    - row_count
    - date_range
    post_silver_validation_checks:
    - disaster_location_candidate_presence
    - event_start_date_validity
    - province_event_month_mapping
    - validation_event_geography_coverage
    redistribution: public
  vancouver_property_parcels:
    display_name: Vancouver Property Parcel Polygons
    source_group: municipal
    provider: City of Vancouver
    source_url: https://opendata.vancouver.ca/explore/dataset/property-parcel-polygons/
    access_method: open_data_api_or_download
    expected_frequency: periodic
    file_format: geojson
    spatial_grain: parcel_polygon
    temporal_grain: current_snapshot
    time_window:
      start_year: null
      end_year: null
    target_bronze_table: bronze_vancouver_property_parcels
    target_silver_table: silver_property_parcel
    target_silver_tables:
    - silver_property_parcel
    downstream_use:
    - vancouver_parcel_exposure
    - vancouver_parcel_flood_overlay
    required_fields:
    - geometry
    identity_contract:
      primary_entity: parcel
      stable_id_required: true
      candidate_id_fields:
      - parcel_id
      - pid
      - site_id
      - legal_description
      validation_rule: at_least_one_candidate_id_present
      note: 'The parcel source must provide a stable parcel identity for downstream joins, but the exact
        raw field name should be confirmed during Silver profiling.

        '
    validation_checks:
    - schema_hash
    - row_count
    - geometry_validity
    - crs_check
    post_silver_validation_checks:
    - parcel_identity_candidate_presence
    - parcel_geometry_validity
    redistribution: public
    portal_type: opendatasoft
    opendatasoft_base_url: https://opendata.vancouver.ca
    dataset_id: property-parcel-polygons
    preferred_export_format: geojson
  vancouver_property_tax:
    display_name: Vancouver Property Tax Report
    source_group: municipal
    provider: City of Vancouver
    source_url: https://opendata.vancouver.ca/explore/dataset/property-tax-report/
    access_method: open_data_api_or_download
    expected_frequency: annual
    file_format: csv
    spatial_grain: parcel_or_property
    temporal_grain: annual
    time_window:
      start_year: null
      end_year: null
    target_bronze_table: bronze_vancouver_property_tax
    target_silver_table: silver_property_tax_assessment
    target_silver_tables:
    - silver_property_tax_assessment
    downstream_use:
    - vancouver_property_value_proxy
    - vancouver_parcel_exposure
    required_fields:
    - pid
    - tax_assessment_year
    - current_land_value
    - current_improvement_value
    - report_year
    join_contract:
      intended_join_target: vancouver_property_parcels
      intended_join_target_silver_table: silver_property_parcel
      join_required_for_downstream: true
      candidate_join_keys:
      - pid
      - folio
      - land_coordinate
      - plan
      - lot
      - block
      validation_rule: pid_or_folio_required_for_parcel_join
      note: 'The exact Vancouver property tax join key should be confirmed during Silver profiling. The
        contract records candidate keys instead of prematurely forcing a raw field name that may not exist
        in the source export.

        '
    validation_checks:
    - schema_hash
    - row_count
    - non_negative_values
    post_silver_validation_checks:
    - join_key_candidate_presence
    - parcel_join_coverage
    - total_value_derived_from_land_and_improvement
    - property_value_non_negative
    redistribution: public
    portal_type: opendatasoft
    opendatasoft_base_url: https://opendata.vancouver.ca
    dataset_id: property-tax-report
    preferred_export_format: csv
  vancouver_building_permits:
    display_name: Vancouver Issued Building Permits
    source_group: municipal
    provider: City of Vancouver
    source_url: https://opendata.vancouver.ca/explore/dataset/issued-building-permits/
    access_method: open_data_api_or_download
    expected_frequency: monthly
    file_format: csv
    spatial_grain: address_or_parcel
    temporal_grain: permit
    time_window:
      start_year: 2017
      end_year: null
    target_bronze_table: bronze_vancouver_building_permits
    target_silver_table: silver_building_permit
    target_silver_tables:
    - silver_building_permit
    downstream_use:
    - vancouver_development_activity
    - vancouver_parcel_exposure
    - vancouver_permit_property_map
    required_fields:
    - permitnumber
    - issuedate
    - projectvalue
    - address
    join_contract:
      intended_join_target: vancouver_property_parcels
      intended_join_target_silver_table: silver_property_parcel
      join_required_for_downstream: true
      candidate_join_keys:
      - address
      - geom
      - geo_point_2d
      validation_rule: address_or_geometry_candidate_required_for_property_mapping
    validation_checks:
    - schema_hash
    - row_count
    - date_range
    post_silver_validation_checks:
    - permit_date_validity
    - permit_value_non_negative
    - parcel_or_address_join_coverage
    - permit_geometry_candidate_presence
    redistribution: public
    portal_type: opendatasoft
    opendatasoft_base_url: https://opendata.vancouver.ca
    dataset_id: issued-building-permits
    preferred_export_format: csv
    coordinate_contract:
      required_for_spatial_overlay: true
      candidate_latitude_fields: []
      candidate_longitude_fields: []
      candidate_geometry_fields:
      - geom
      - geo_point_2d
      validation_rule: geometry_or_point_field_required_after_silver_standardization
      note: Vancouver building permits provide address plus geom / geo_point_2d rather than explicit latitude
        and longitude columns.
  vancouver_floodplain:
    display_name: Vancouver Designated Floodplain
    source_group: municipal
    provider: City of Vancouver
    source_url: https://opendata.vancouver.ca/explore/dataset/designated-floodplain/
    access_method: open_data_api_or_download
    expected_frequency: periodic
    file_format: geojson
    spatial_grain: polygon
    temporal_grain: current_snapshot
    time_window:
      start_year: null
      end_year: null
    target_bronze_table: bronze_vancouver_floodplain
    target_silver_table: silver_flood_hazard_zone
    target_silver_tables:
    - silver_flood_hazard_zone
    downstream_use:
    - vancouver_parcel_flood_overlay
    - floodplain_overlap_pct
    - vancouver_parcel_exposure
    required_fields:
    - geometry
    validation_checks:
    - schema_hash
    - row_count
    - geometry_validity
    - crs_check
    redistribution: public
    portal_type: opendatasoft
    opendatasoft_base_url: https://opendata.vancouver.ca
    dataset_id: designated-floodplain
    preferred_export_format: geojson
  calgary_property_assessment:
    display_name: Calgary Property Assessment
    source_group: municipal
    provider: City of Calgary
    source_url: https://data.calgary.ca/
    access_method: open_data_api_or_download
    expected_frequency: annual
    file_format: csv
    spatial_grain: property_or_parcel
    temporal_grain: annual
    time_window:
      start_year: null
      end_year: null
    target_bronze_table: bronze_calgary_property_assessment
    target_silver_table: silver_property_assessment
    target_silver_tables:
    - silver_property_assessment
    downstream_use:
    - calgary_property_flood_exposure
    - assessed_value_proxy
    required_fields:
    - roll_year
    - roll_number
    - assessed_value
    - multipolygon
    coordinate_contract:
      required_for_spatial_overlay: true
      candidate_latitude_fields: []
      candidate_longitude_fields: []
      candidate_geometry_fields:
      - multipolygon
      validation_rule: multipolygon_required_after_silver_standardization
      note: Calgary property assessment provides a raw multipolygon WKT-style geometry field rather than
        separate latitude and longitude columns.
    validation_checks:
    - schema_hash
    - row_count
    - non_negative_values
    - coordinate_range
    post_silver_validation_checks:
    - property_identity_candidate_presence
    - property_geometry_candidate_presence
    - property_flood_overlay_coverage
    - assessed_value_non_negative
    redistribution: public
    portal_type: socrata
    socrata_domain: data.calgary.ca
    dataset_id: 4bsw-nn7w
    preferred_export_format: csv
    identity_contract:
      primary_entity: calgary_property
      stable_id_required: true
      candidate_id_fields:
      - roll_number
      - cpid
      - unique_key
      validation_rule: at_least_one_candidate_id_present
