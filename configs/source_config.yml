      base_url: https://collaboration.cmc.ec.gc.ca/cmc/hydrometrics/www/HydrometricNetworkBasinPolygons/geojson/
      chunks_for_project_scope:
      - MDA_ADP_05.zip
      - MDA_ADP_06.zip
      - MDA_ADP_07.zip
      - MDA_ADP_08.zip
      - MDA_ADP_09.zip
      - MDA_ADP_10.zip
      - MDA_ADP_11.zip
      reference_files:
      - Included_stations.txt
      - UpdatedStationList.xlsx
      note: Project-scope chunks were selected from local silver_hydro_station drainage prefixes 05, 06,
        07, 08, 09, 10, and 11. Source probe confirmed each chunk contains DrainageBasin, PourPoint, and
        Station GeoJSON layers.
    basin_polygon_contract:
      required_for_downstream_features: true
      confirmed_source_layers:
        drainage_basin:
          filename_pattern: MDA_ADP_*_DrainageBasin_BassinDeDrainage.geojson
          target_silver_table: silver_hydro_basin_polygon
          geometry_type: Polygon
          source_crs: EPSG:4326
          confirmed_fields:
            station_id: StationNum
            station_name: NameNom
            status_en: Status
            status_fr: Etat
            basin_area_sq_km: Area_km2
            basin_area_sq_km_fr: Aire_km2
            remark_en: Remark
            remark_fr: Remarque
            source_version: Version
            source_revision_date: Date_rev
            shape_length_m: Shape_Leng
            shape_area_sq_m: Shape_Area
        pour_point:
          filename_pattern: MDA_ADP_*_PourPoint_PointExutoire.geojson
          target_silver_table: silver_hydro_basin_pour_point
          geometry_type: Point
          source_crs: EPSG:4326
          confirmed_fields:
            station_id: StationNum
            station_name: NameNom
            status_en: Status
            status_fr: Etat
            province_or_territory: ProvTerr
        station_point:
          filename_pattern: MDA_ADP_*_Station.geojson
          target_silver_table: silver_hydro_basin_station_point
          geometry_type: Point
          source_crs: EPSG:4326
          confirmed_fields:
            station_id: StationNum
            station_name: NameNom
            status_en: Status
            status_fr: Etat
            province_or_territory: ProvTerr
            hydat_version: HYDAT_ver
      confirmed_join_key:
        source_field: StationNum
        silver_hydro_station_field: station_id
        silver_hydro_daily_field: station_id
      initial_reference_join_audit:
        silver_hydro_station_count: 3428
        included_stations_match_count: 3210
        included_stations_match_rate: 0.936406
        updated_station_list_match_count: 3206
        updated_station_list_match_rate: 0.935239
        note: Unmatched local hydro stations are concentrated in AB drainage prefix 05 and include many
          irrigation canal, drain, reservoir, and artificial water-management stations.
      mda_adp_11_layer_probe:
        drainage_basin_feature_count: 166
        pour_point_feature_count: 166
        station_point_feature_count: 166
        cross_layer_station_id_intersection_count: 166
        silver_hydro_station_match_count: 43
        note: MDA_ADP_11 was used as a small schema probe. Its three layers share the same StationNum
          set.
      validation_rule: StationNum and valid geometry are required after Silver standardization. The three
        source layers must preserve station-id alignment. Join coverage against existing hydro Silver
        tables must be reported, not assumed.
      full_project_scope_audit:
        silver_hydro_basin_polygon_rows: 5071
        silver_hydro_basin_pour_point_rows: 5071
        silver_hydro_basin_station_point_rows: 5071
        mda_adp_region_counts:
          '05': 1740
          '06': 164
          '07': 476
          08: 2180
          09: 87
          '10': 258
          '11': 166
        geometry_original_valid_count: 3498
        geometry_original_invalid_count: 1573
        geometry_repaired_count: 1573
        geometry_final_valid_count: 5071
        geometry_type_counts:
          Polygon: 5024
          MultiPolygon: 47
        existing_silver_hydro_station_join_audit:
          silver_hydro_station_count: 3428
          polygon_station_id_count: 5071
          match_count: 3212
          match_rate: 0.936989
          unmatched_silver_hydro_station_count: 216
          province_match_summary:
            AB:
              station_count: 1104
              matched_count: 962
              unmatched_count: 142
              match_rate: 0.871377
            BC:
              station_count: 2324
              matched_count: 2250
              unmatched_count: 74
              match_rate: 0.968158
        interpretation: Hydro basin polygons provide spatial footprint/allocation data. They do not replace
          HYDAT daily flow/level observations. Existing hydro measurements remain the measurement source;
          basin polygons improve grid-level spatial allocation.
